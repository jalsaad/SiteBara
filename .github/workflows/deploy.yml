name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger deploy webhook
        run: |
          curl -sf -X POST "${{ secrets.DEPLOY_WEBHOOK_URL }}" \
            -H "x-deploy-secret: ${{ secrets.DEPLOY_SECRET }}" \
            --max-time 15 \
            --retry 3 \
            --retry-delay 5
